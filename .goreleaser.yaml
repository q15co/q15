version: 2
project_name: q15

builds:
  # One binary ships. It carries the management verbs, the configuration truth
  # and the provider-credential verbs, and it is Linux only: it drives a podman
  # stack through the user's systemd, so there is no runtime to target
  # elsewhere. The release identifier is linked in, which is what `q15 version`
  # reports.
  - id: q15
    dir: systems/agent
    main: ./cmd/q15
    binary: q15
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X main.q15Release={{ .Version }}

archives:
  - id: q15
    ids:
      - q15
    formats:
      - tar.gz
    name_template: "q15_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native
  sort: asc

release:
  draft: false
  replace_existing_draft: true
