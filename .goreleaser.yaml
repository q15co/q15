version: 2
project_name: q15

builds:
  # One binary ships. It carries the management verbs, the configuration truth
  # and the provider-credential verbs. Linux is the platform the stack runs on:
  # the management verbs drive podman through the user's systemd. macOS on Apple
  # silicon is in progress and gets the same binary for the verbs that do not
  # need a stack, which is why darwin is in the matrix; the Go linker ad-hoc
  # signs darwin/arm64, so that build runs without a developer certificate. The
  # release identifier is linked in, which is what `q15 version` reports.
  - id: q15
    dir: systems/agent
    main: ./cmd/q15
    binary: q15
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X main.q15Release={{ .Version }}

archives:
  - id: q15
    ids:
      - q15
    formats:
      - tar.gz
    name_template: "q15_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  # Every archive is signed with minisign, against the release key in
  # deploy/install/q15.pub, which is the key install.sh embeds. The release job
  # will not run unless the secret key it signs with derives that public key, so
  # a published release is always one the installer accepts.
  #
  # -W is passed because the key has no password: minisign cannot read one that
  # is not typed, so a signature job cannot use a protected key.
  - id: minisign
    cmd: minisign
    artifacts: archive
    signature: "${artifact}.minisig"
    args:
      - "-S"
      - "-W"
      - "-s"
      - "{{ .Env.MINISIGN_KEY_PATH }}"
      - "-x"
      - "${signature}"
      - "-m"
      - "${artifact}"

changelog:
  use: github-native
  sort: asc

release:
  draft: false
  replace_existing_draft: true
