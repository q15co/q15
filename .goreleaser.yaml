version: 2
project_name: q15

builds:
  - id: q15-auth
    dir: systems/agent
    main: ./cmd/q15-auth
    binary: q15-auth
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

  # The management CLI ships for Linux only: it drives a podman stack through
  # the user's systemd, so there is no runtime to target elsewhere. The release
  # identifier is linked in, which is what `q15 version` reports.
  - id: q15
    dir: systems/agent
    main: ./cmd/q15
    binary: q15
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X main.q15Release={{ .Version }}

archives:
  - id: q15-auth
    ids:
      - q15-auth
    formats:
      - tar.gz
    name_template: "q15-auth_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

  - id: q15
    ids:
      - q15
    formats:
      - tar.gz
    name_template: "q15_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native
  sort: asc

release:
  draft: false
  replace_existing_draft: true
