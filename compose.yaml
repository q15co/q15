# Local-development stack for rootless Podman. For image-only deployment consumption, see
# deploy/compose/docker-compose.image-first.yml.
services:
  q15-proxy:
    image: localhost/q15-proxy:dev
    pull_policy: build
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec ': >/dev/tcp/127.0.0.1/50052; : >/dev/tcp/127.0.0.1/18080'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      GITHUB_TOKEN_FILE: /run/secrets/github_token
    volumes:
      - type: bind
        source: ./deploy/compose/proxy-policy.yaml
        target: /etc/q15/proxy/policy.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: q15_proxy_state
        target: /var/lib/q15/proxy
    secrets:
      - github_token

  q15-exec:
    image: localhost/q15-exec:dev
    pull_policy: build
    build:
      context: .
      dockerfile: docker/exec.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      q15-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec ': >/dev/tcp/127.0.0.1/50051'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    environment:
      # The stack runs in UTC unless TZ is set in the environment.
      TZ: ${TZ:-UTC}
    volumes:
      - type: volume
        source: q15_workspace
        target: /workspace
      - type: volume
        source: q15_memory
        target: /memory
        read_only: true
      - type: volume
        source: q15_media
        target: /media
      - type: volume
        source: q15_skills
        target: /skills
      - type: volume
        source: q15_exec_nix_store
        target: /nix

  q15-qdrant:
    image: docker.io/qdrant/qdrant:v1.17.1
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec ': >/dev/tcp/127.0.0.1/6334'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - type: volume
        source: q15_qdrant_storage
        target: /qdrant/storage

  q15-tei:
    # Deprecated. The install profile runs ollama for chat and for embeddings, so this
    # service is not part of it (see the install spec, issue #215), and it is removed one
    # release after that profile ships. It stays for existing deployments and GPU hosts.
    #
    # Local embeddings backend (Hugging Face Text Embeddings Inference), served keylessly
    # and consumed by q15-agent via the openai embeddings provider. Default model:
    # Qwen/Qwen3-Embedding-0.6B at 1024 dimensions; weights download into the
    # q15_tei_hf_cache volume on first start. The default image is the CPU build, so a host
    # without a GPU can start: on a GPU host set TEI_IMAGE to :turing-1.9 (T4, RTX 2000
    # series) or :1.9 (Ampere and newer) and add the CDI device with a local override file.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    init: true
    command:
      - --model-id
      - ${TEI_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --served-model-name
      - ${TEI_SERVED_MODEL_NAME:-qwen3-embedding-0.6b}
      # Keep >= the agent config's batch_size (TEI's own default is 32).
      - --max-client-batch-size
      - ${TEI_MAX_CLIENT_BATCH_SIZE:-128}
      - --port
      - "80"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - type: volume
        source: q15_tei_hf_cache
        target: /data

  q15-postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: q15
      POSTGRES_DB: q15
      POSTGRES_PASSWORD_FILE: /run/secrets/q15_postgres_password
    secrets:
      - q15_postgres_password
    volumes:
      - type: volume
        source: q15_postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q15 -d q15"]
      interval: 5s
      timeout: 3s
      retries: 20

  q15-ollama:
    image: docker.io/ollama/ollama:0.40.7
    restart: unless-stopped
    volumes:
      - type: volume
        source: q15_ollama_models
        target: /root/.ollama

  q15-agent:
    image: localhost/q15-agent:dev
    pull_policy: build
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        Q15_BUILD_COMMIT: ${Q15_BUILD_COMMIT:-unknown}
        Q15_BUILD_MODIFIED: ${Q15_BUILD_MODIFIED:-unknown}
    restart: unless-stopped
    init: true
    group_add: ["1000"]
    depends_on:
      q15-postgres:
        condition: service_healthy
      q15-ollama:
        condition: service_started
      q15-exec:
        condition: service_healthy
      q15-qdrant:
        condition: service_healthy
      q15-tei:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/q15-agent-ready &&
          kill -0 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    environment:
      HOME: /root
      PGHOST: q15-postgres
      PGUSER: q15
      PGDATABASE: q15
      PGSSLMODE: disable
      PGPASSWORD_FILE: /run/secrets/q15_postgres_password
      GODEBUG: updatemaxprocs=0
      GOMAXPROCS: "1"
      TZ: ${TZ:-UTC}
      MOONSHOT_API_KEY_FILE: /run/secrets/moonshot_api_key
      OLLAMA_API_KEY_FILE: /run/secrets/ollama_api_key
      ZAI_API_KEY_FILE: /run/secrets/zai_api_key
      DEEPINFRA_API_KEY_FILE: /run/secrets/deepinfra_api_key
      Q15_TELEGRAM_TOKEN_FILE: /run/secrets/q15_telegram_token
      Q15_TELEGRAM_ALLOWED_USER_IDS_FILE: /run/secrets/q15_telegram_allowed_user_ids
      BRAVE_API_KEY_FILE: /run/secrets/brave_api_key
      Q15_QDRANT_URL: http://q15-qdrant:6334
      Q15_EMBEDDINGS_BASE_URL: http://q15-tei:80
    volumes:
      - type: bind
        source: ./deploy/compose/agent-config.yaml
        target: /etc/q15/agent/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/compose/auth
        target: /etc/q15/auth
      - type: volume
        source: q15_workspace
        target: /workspace
      - type: volume
        source: q15_memory
        target: /memory
      - type: volume
        source: q15_media
        target: /media
      - type: volume
        source: q15_skills
        target: /skills
      - type: volume
        source: q15_agent_state
        target: /var/lib/q15/agent
      - type: volume
        source: q15_bridge
        target: /run/q15
    secrets:
      - q15_postgres_password
      - moonshot_api_key
      - ollama_api_key
      - zai_api_key
      - deepinfra_api_key
      - brave_api_key
      - q15_telegram_token
      - q15_telegram_allowed_user_ids

  q15-web:
    image: localhost/q15-web:dev
    pull_policy: build
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24.21.0}
    user: "65532:1000"
    restart: unless-stopped
    init: true
    depends_on:
      q15-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Q15_WEB_LISTEN: 0.0.0.0:8080
      Q15_WEB_BRIDGE: unix:///run/q15/bridge.sock
      Q15_WEB_ORIGIN: ${Q15_WEB_ORIGIN:-http://localhost:8080}
      Q15_WEB_STATE_DIR: /var/lib/q15-web
    volumes:
      - type: volume
        source: q15_web_state
        target: /var/lib/q15-web
      - type: volume
        source: q15_bridge
        target: /run/q15
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/q15-web", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  q15_postgres_data:
  q15_ollama_models:
  q15_web_state:
  q15_bridge:
  q15_agent_state:
  q15_exec_nix_store:
  q15_media:
  q15_memory:
  q15_proxy_state:
  q15_qdrant_storage:
  q15_skills:
  q15_workspace:
  q15_tei_hf_cache:

# Secret file paths below are local ignored files. Seed them from deploy/compose/secrets/*.example.
secrets:
  q15_postgres_password:
    file: ./deploy/compose/secrets/q15_postgres_password
  moonshot_api_key:
    file: ./deploy/compose/secrets/moonshot_api_key
  ollama_api_key:
    file: ./deploy/compose/secrets/ollama_api_key
  zai_api_key:
    file: ./deploy/compose/secrets/zai_api_key
  deepinfra_api_key:
    file: ./deploy/compose/secrets/deepinfra_api_key
  brave_api_key:
    file: ./deploy/compose/secrets/brave_api_key
  q15_telegram_token:
    file: ./deploy/compose/secrets/q15_telegram_token
  q15_telegram_allowed_user_ids:
    file: ./deploy/compose/secrets/q15_telegram_allowed_user_ids
  github_token:
    file: ./deploy/compose/secrets/github_token
