name: Publish Main Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Main Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache repo-local tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles('scripts/tool-versions.sh', 'go.work') }}

      - name: Install repo-local tools
        run: make project-setup

      - name: Run repo verification
        run: make verify

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Detect which service images actually need to be built for this push.
  # This keeps the 3 services × 2 platforms matrix from running on every
  # unrelated main-branch change, while still building every service on the
  # first push to main or any shared-path change.
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build-matrix: ${{ steps.detect.outputs.build-matrix }}
      publish-matrix: ${{ steps.detect.outputs.publish-matrix }}
      agent: ${{ steps.detect.outputs.agent }}
      exec: ${{ steps.detect.outputs.exec }}
      proxy: ${{ steps.detect.outputs.proxy }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          set -euo pipefail

          PREV_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          echo "previous commit: ${PREV_SHA}"
          echo "current commit:  ${HEAD_SHA}"

          # On the first push to a branch, github.event.before is all zeros.
          # In that case (or any other missing-previous-commit scenario), treat
          # every tracked file as changed so that all service images are built.
          if [[ -z "${PREV_SHA:-}" || "${PREV_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No previous commit available; treating all files as changed to build every service."
            CHANGED_FILES=$(git ls-tree -r --name-only "${HEAD_SHA}")
          else
            echo "Detecting changed files between ${PREV_SHA} and ${HEAD_SHA} ..."
            if git diff --name-only "${PREV_SHA}" "${HEAD_SHA}" > /tmp/changed_files 2> /tmp/diff_err; then
              CHANGED_FILES=$(cat /tmp/changed_files)
            else
              echo "git diff failed; building all services as a safe fallback." >&2
              cat /tmp/diff_err >&2
              CHANGED_FILES=$(git ls-tree -r --name-only "${HEAD_SHA}")
            fi
          fi

          matches_any() {
            local file="$1"
            shift
            for pattern in "$@"; do
              case "${file}" in
                ${pattern}) return 0 ;;
              esac
            done
            return 1
          }

          AGENT=false
          EXEC=false
          PROXY=false

          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue

            if matches_any "${file}" \
                "systems/agent/**" \
                "libs/**" \
                "go.work" \
                "go.work.sum" \
                "docker/agent.Dockerfile"; then
              AGENT=true
            fi

            if matches_any "${file}" \
                "systems/exec/**" \
                "libs/exec-contract/**" \
                "go.work" \
                "go.work.sum" \
                "docker/exec.Dockerfile"; then
              EXEC=true
            fi

            if matches_any "${file}" \
                "systems/proxy/**" \
                "libs/proxy-contract/**" \
                "go.work" \
                "go.work.sum" \
                "docker/proxy.Dockerfile"; then
              PROXY=true
            fi
          done <<< "${CHANGED_FILES}"

          ANY=false
          if [[ "${AGENT}" == true || "${EXEC}" == true || "${PROXY}" == true ]]; then
            ANY=true
          fi

          echo "agent=${AGENT}" >> "${GITHUB_OUTPUT}"
          echo "exec=${EXEC}" >> "${GITHUB_OUTPUT}"
          echo "proxy=${PROXY}" >> "${GITHUB_OUTPUT}"
          echo "any=${ANY}" >> "${GITHUB_OUTPUT}"
          echo "agent=${AGENT}"
          echo "exec=${EXEC}"
          echo "proxy=${PROXY}"
          echo "any=${ANY}"

          build_entry() {
            local service="$1"
            local image="$2"
            local dockerfile="$3"
            local platform="$4"
            local platform_id="$5"
            local runner="$6"
            printf '{"service":"%s","image":"%s","dockerfile":"%s","platform":"%s","platform_id":"%s","runner":"%s"}' \
              "${service}" "${image}" "${dockerfile}" "${platform}" "${platform_id}" "${runner}"
          }

          build_entries=()
          if [[ "${AGENT}" == true ]]; then
            build_entries+=("$(build_entry q15-agent ghcr.io/q15co/q15-agent docker/agent.Dockerfile linux/amd64 amd64 ubuntu-24.04)")
            build_entries+=("$(build_entry q15-agent ghcr.io/q15co/q15-agent docker/agent.Dockerfile linux/arm64 arm64 ubuntu-24.04-arm)")
          fi
          if [[ "${EXEC}" == true ]]; then
            build_entries+=("$(build_entry q15-exec ghcr.io/q15co/q15-exec docker/exec.Dockerfile linux/amd64 amd64 ubuntu-24.04)")
            build_entries+=("$(build_entry q15-exec ghcr.io/q15co/q15-exec docker/exec.Dockerfile linux/arm64 arm64 ubuntu-24.04-arm)")
          fi
          if [[ "${PROXY}" == true ]]; then
            build_entries+=("$(build_entry q15-proxy ghcr.io/q15co/q15-proxy docker/proxy.Dockerfile linux/amd64 amd64 ubuntu-24.04)")
            build_entries+=("$(build_entry q15-proxy ghcr.io/q15co/q15-proxy docker/proxy.Dockerfile linux/arm64 arm64 ubuntu-24.04-arm)")
          fi

          if [[ ${#build_entries[@]} -eq 0 ]]; then
            BUILD_JSON="[]"
          else
            BUILD_JSON="[$(printf '%s\n' "${build_entries[@]}" | paste -sd ',' -)]"
          fi
          echo "build-matrix=${BUILD_JSON}" >> "${GITHUB_OUTPUT}"
          echo "build-matrix=${BUILD_JSON}"

          publish_entry() {
            local service="$1"
            local image="$2"
            printf '{"service":"%s","image":"%s"}' "${service}" "${image}"
          }

          publish_entries=()
          if [[ "${AGENT}" == true ]]; then
            publish_entries+=("$(publish_entry q15-agent ghcr.io/q15co/q15-agent)")
          fi
          if [[ "${EXEC}" == true ]]; then
            publish_entries+=("$(publish_entry q15-exec ghcr.io/q15co/q15-exec)")
          fi
          if [[ "${PROXY}" == true ]]; then
            publish_entries+=("$(publish_entry q15-proxy ghcr.io/q15co/q15-proxy)")
          fi

          if [[ ${#publish_entries[@]} -eq 0 ]]; then
            PUBLISH_JSON="[]"
          else
            PUBLISH_JSON="[$(printf '%s\n' "${publish_entries[@]}" | paste -sd ',' -)]"
          fi
          echo "publish-matrix=${PUBLISH_JSON}" >> "${GITHUB_OUTPUT}"
          echo "publish-matrix=${PUBLISH_JSON}"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: [verify, detect-changes]
    # Only run when at least one service-relevant path changed.
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The matrix is generated dynamically from the detect-changes job so that
      # only the services whose paths changed are built.
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.build-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform_id }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform_id }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} manifest
    runs-on: ubuntu-24.04
    needs: [build, detect-changes]
    # Only publish manifests for services that were actually built.
    if: needs.detect-changes.outputs.any == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.publish-matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Prepare manifest metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main
            type=sha,format=short,prefix=sha-

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags_input=${TAGS:-}
          max_attempts=3
          attempt=1

          refs=()
          for file in /tmp/digests/*; do
            refs+=("${IMAGE}@sha256:$(basename "$file")")
          done

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "no digests found for ${IMAGE}" >&2
            exit 1
          fi

          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tags+=("-t" "$tag")
          done <<< "$tags_input"

          printf 'source manifests:\n'
          printf '  %s\n' "${refs[@]}"

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "creating manifest for ${IMAGE} (attempt ${attempt}/${max_attempts})"
            if timeout --foreground 2m docker buildx imagetools create "${tags[@]}" "${refs[@]}"; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "failed to create manifest for ${IMAGE} after ${max_attempts} attempts" >&2
              exit "$status"
            fi

            echo "manifest create failed with status ${status}; retrying in 10s" >&2
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${{ matrix.image }}:main"
