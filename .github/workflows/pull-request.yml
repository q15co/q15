name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Browser impact and fixture contract
    runs-on: ubuntu-24.04
    outputs:
      ui: ${{ steps.impact.outputs.ui }}
      exec: ${{ steps.impact.outputs.exec }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check browser fixture copies unconditionally
        run: make ui-fixtures-check
      - name: Detect UI changes
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          impact="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | scripts/image-build-impact.sh)"
          echo "ui=$(jq -r '.ui' <<< "${impact}")" >> "${GITHUB_OUTPUT}"
          echo "exec=$(jq -r '.exec' <<< "${impact}")" >> "${GITHUB_OUTPUT}"

  exec-image:
    name: Verify exec image loader paths
    needs: changes
    if: needs.changes.outputs.exec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: true
      - uses: cachix/install-nix-action@v31
      - name: Check the loader paths against nixpkgs
        env:
          # The nixpkgs comparison skips itself without nix, so this job, whose
          # only purpose is that comparison, turns the skip into a failure.
          Q15_REQUIRE_NIX: "1"
        run: go test -v ./systems/exec/internal/app/

  ui:
    name: Browser Verify
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read shared tool pins
        id: versions
        run: |
          source scripts/tool-versions.sh
          echo "node=${NODE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "pnpm=${PNPM_VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: systems/web/ui/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: true
      - name: Check package pins
        run: |
          source scripts/tool-versions.sh
          jq -e --arg manager "pnpm@${PNPM_VERSION}" --arg node "${NODE_VERSION}" '.packageManager == $manager and .engines.node == $node' systems/web/ui/package.json
      - name: Frozen dependency install
        working-directory: systems/web/ui
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint and formatting
        working-directory: systems/web/ui
        run: pnpm check
      - name: Contract and component tests with coverage
        working-directory: systems/web/ui
        run: pnpm test:coverage
      - name: Upload browser coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-coverage
          path: systems/web/ui/coverage/
          retention-days: 7
          if-no-files-found: warn
      - name: Build embedded PWA
        working-directory: systems/web/ui
        run: pnpm build
      - name: Install browser
        working-directory: systems/web/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser behavior tests
        working-directory: systems/web/ui
        run: pnpm test:e2e
      - name: Confirm build artifacts stay ignored
        run: |
          test "$(git ls-files systems/web/internal/assets/dist)" = systems/web/internal/assets/dist/.gitkeep
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard systems/web/internal/assets/dist systems/web/ui)"
  verify:
    name: Pull Request Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read shared Node pin
        id: versions
        run: |
          source scripts/tool-versions.sh
          echo "node=${NODE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Cache repo-local tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles('scripts/tool-versions.sh', 'go.work') }}

      - name: Install repo-local tools
        run: make project-setup

      - name: Run repo verification
        run: make verify

      - name: Check reachable Go vulnerabilities
        run: make vulncheck

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
