overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1

allowBuilds:
  "@tailwindcss/oxide": true

# Vite+ bundles Vite 8 under its own package version.
peerDependencyRules:
  allowedVersions:
    vite: 1.0.0

minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.102"
  - "@ai-sdk/provider-utils@5.0.53"
  - "@ai-sdk/provider@4.0.21"
  - ai@7.0.126
