# Model discovery configuration.
#
# Providers manage their own models. The agent queries each provider's roster
# endpoint at startup (and refreshes periodically) to discover available models.
# There is no hand-typed models: list — the provider roster IS the model config.
#
# Interactive and decision models are runtime selections. The agent discovers
# eligible defaults and persists them under /workspace/.q15/agent/selection.json.
# Use switch_model (slot "interactive" or "decision") to switch them. Background
# cognition jobs inherit the interactive model unless switch_cognition_model
# targets a specific job. Their automatic decision stages are tracked in #373.
# Embeddings remain pinned to the tool's model and transport below; changing
# either requires rebuilding the affected vector collections. Chat and decision
# switches never change the embedding setup.

providers:
  - name: ollama-cloud
    type: ollama
    base_url: https://ollama.com
    key_env: OLLAMA_API_KEY
    discovery:
      models_dev: true

agent:
  name: Q15
  memory_recent_turns: 6
  tools:
    web_search:
      brave_api_key_env: BRAVE_API_KEY
    embeddings:
      qdrant_url_env: Q15_QDRANT_URL
      gemini_api_key_env: Q15_GEMINI_API_KEY
      model: gemini-embedding-2
      dimensions: 768
    schedule:
      max_jobs: 64
      max_run_turns: 16
  telegram:
    token_env: Q15_TELEGRAM_TOKEN
    allowed_user_ids_env: Q15_TELEGRAM_ALLOWED_USER_IDS
