# Model discovery configuration.
#
# Providers manage their own models. The agent queries each provider's roster
# endpoint at startup (and refreshes periodically) to discover available models.
# There is no hand-typed models: list — the provider roster IS the model config.
#
# Which model chats, decides, and embeds is runtime state, not config: the
# agent auto-selects an interactive model on first run (Text+ToolCalling
# preferred), holds decision and embed slots the same way, and persists every
# selection under /workspace/.q15/agent/selection.json. The agent can list and
# switch live models at runtime with list_providers/list_models/switch_model
# (slot "interactive" by default, also "decision" and "embed"); switches are
# persisted and survive restart. Background cognition jobs inherit the
# interactive model unless switch_cognition_model targets a specific job.
# Each chat turn tries the current model first, then the other chat-capable
# roster models in discovery order, skipping the decision-selected model.

providers:
  - name: ollama-cloud
    type: ollama
    base_url: https://ollama.com
    key_env: OLLAMA_API_KEY
    discovery:
      models_dev: true

agent:
  name: Q15
  memory_recent_turns: 6
  tools:
    web_search:
      brave_api_key_env: BRAVE_API_KEY
    embeddings:
      qdrant_url_env: Q15_QDRANT_URL
      gemini_api_key_env: Q15_GEMINI_API_KEY
      model: gemini-embedding-2
      dimensions: 768
    schedule:
      max_jobs: 64
      max_run_turns: 16
  telegram:
    token_env: Q15_TELEGRAM_TOKEN
    allowed_user_ids_env: Q15_TELEGRAM_ALLOWED_USER_IDS
