# Canonical image-first deployment example. All q15 services use the same
# synchronized stable or immutable DateVer tag.
services:
  q15-proxy:
    image: ghcr.io/q15co/q15-proxy:${Q15_IMAGE_TAG:-stable}
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec ': >/dev/tcp/127.0.0.1/50052; : >/dev/tcp/127.0.0.1/18080'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      GITHUB_TOKEN_FILE: /run/q15-secrets/github_token
    volumes:
      - type: bind
        source: ./proxy-policy.yaml
        target: /etc/q15/proxy/policy.yaml
        read_only: true
      - type: bind
        source: ./secrets/github_token
        target: /run/q15-secrets/github_token
        read_only: true
      - type: volume
        source: q15_proxy_state
        target: /var/lib/q15/proxy

  q15-exec:
    image: ghcr.io/q15co/q15-exec:${Q15_IMAGE_TAG:-stable}
    restart: unless-stopped
    init: true
    depends_on:
      q15-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec ': >/dev/tcp/127.0.0.1/50051'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    environment:
      TZ: Europe/Berlin
    volumes:
      - type: volume
        source: q15_workspace
        target: /workspace
      - type: volume
        source: q15_memory
        target: /memory
      - type: volume
        source: q15_media
        target: /media
      - type: volume
        source: q15_skills
        target: /skills
      - type: volume
        source: q15_exec_nix_store
        target: /nix

  q15-qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec ': >/dev/tcp/127.0.0.1/6334'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - type: volume
        source: q15_qdrant_storage
        target: /qdrant/storage

  q15-tei:
    # Local embeddings backend (Hugging Face Text Embeddings Inference),
    # served keylessly to q15-agent via the openai embeddings provider.
    # Default model: Qwen/Qwen3-Embedding-0.6B at 1024 dimensions; weights
    # download into the q15_tei_hf_cache volume on first start. The
    # turing-1.9 image targets Turing GPUs (T4, RTX 2000 series); set
    # TEI_IMAGE for other hardware and remove the GPU reservation on
    # CPU-only hosts. Gated or private models need HF_TOKEN on the container.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:turing-1.9}
    restart: unless-stopped
    init: true
    command:
      - --model-id
      - ${TEI_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --served-model-name
      - ${TEI_SERVED_MODEL_NAME:-qwen3-embedding-0.6b}
      # Keep >= the agent config's batch_size (TEI's own default is 32).
      - --max-client-batch-size
      - ${TEI_MAX_CLIENT_BATCH_SIZE:-128}
      - --port
      - "80"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - type: volume
        source: q15_tei_hf_cache
        target: /data

  q15-agent:
    image: ghcr.io/q15co/q15-agent:${Q15_IMAGE_TAG:-stable}
    restart: unless-stopped
    init: true
    depends_on:
      q15-exec:
        condition: service_healthy
      q15-qdrant:
        condition: service_healthy
      q15-tei:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/q15-agent-ready &&
          kill -0 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    environment:
      HOME: /root
      GODEBUG: updatemaxprocs=0
      GOMAXPROCS: "1"
      TZ: Europe/Berlin
      MOONSHOT_API_KEY_FILE: /run/q15-secrets/moonshot_api_key
      OLLAMA_API_KEY_FILE: /run/q15-secrets/ollama_api_key
      ZAI_API_KEY_FILE: /run/q15-secrets/zai_api_key
      Q15_TELEGRAM_TOKEN_FILE: /run/q15-secrets/q15_telegram_token
      Q15_TELEGRAM_ALLOWED_USER_IDS_FILE: /run/q15-secrets/q15_telegram_allowed_user_ids
      BRAVE_API_KEY_FILE: /run/q15-secrets/brave_api_key
      Q15_QDRANT_URL: http://q15-qdrant:6334
      Q15_EMBEDDINGS_BASE_URL: http://q15-tei:80
    volumes:
      - type: bind
        source: ./agent-config.yaml
        target: /etc/q15/agent/config.yaml
        read_only: true
      - type: bind
        source: ./auth
        target: /etc/q15/auth
      - type: bind
        source: ./secrets/moonshot_api_key
        target: /run/q15-secrets/moonshot_api_key
        read_only: true
      - type: bind
        source: ./secrets/ollama_api_key
        target: /run/q15-secrets/ollama_api_key
        read_only: true
      - type: bind
        source: ./secrets/zai_api_key
        target: /run/q15-secrets/zai_api_key
        read_only: true
      - type: bind
        source: ./secrets/brave_api_key
        target: /run/q15-secrets/brave_api_key
        read_only: true
      - type: bind
        source: ./secrets/q15_telegram_token
        target: /run/q15-secrets/q15_telegram_token
        read_only: true
      - type: bind
        source: ./secrets/q15_telegram_allowed_user_ids
        target: /run/q15-secrets/q15_telegram_allowed_user_ids
        read_only: true
      - type: volume
        source: q15_workspace
        target: /workspace
      - type: volume
        source: q15_memory
        target: /memory
      - type: volume
        source: q15_media
        target: /media
      - type: volume
        source: q15_skills
        target: /skills
      - type: volume
        source: q15_agent_state
        target: /var/lib/q15/agent

volumes:
  q15_agent_state:
  q15_exec_nix_store:
  q15_media:
  q15_memory:
  q15_proxy_state:
  q15_qdrant_storage:
  q15_skills:
  q15_workspace:
  q15_tei_hf_cache:
