providers:
  - name: ollama-cloud
    type: ollama
    base_url: https://ollama.com
    key_env: OLLAMA_API_KEY
    discovery:
      models_dev: true

  - name: ollama-stack
    type: ollama
    # Pod-local Ollama served by the q15-ollama service. Keyless by locality;
    # the live roster picks up whatever models are pulled there.
    base_url: http://q15-ollama:11434

agent:
  name: Q15
  bridge:
    listen_target: unix:///run/q15/bridge.sock
  memory_recent_turns: 6
  tools:
    web_search:
      brave_api_key_env: BRAVE_API_KEY
    embeddings:
      qdrant_url_env: Q15_QDRANT_URL
      # Pod-local Ollama embeddings: the q15-ollama Compose service serves this
      # model's OpenAI-compatible API keylessly, and q15-ollama-init pulls it on
      # first start (override with OLLAMA_IMAGE / OLLAMA_EMBED_MODEL).
      # Hosted alternative: provider: gemini + gemini_api_key_env with model
      # gemini-embedding-2 and dimensions 768.
      provider: openai
      base_url_env: Q15_EMBEDDINGS_BASE_URL
      model: qwen3-embedding:0.6b
      dimensions: 1024
      batch_size: 128
    schedule:
      max_jobs: 64
      max_run_turns: 16
  telegram:
    token_env: Q15_TELEGRAM_TOKEN
    allowed_user_ids_env: Q15_TELEGRAM_ALLOWED_USER_IDS
