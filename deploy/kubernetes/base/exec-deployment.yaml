apiVersion: apps/v1
kind: Deployment
metadata:
  name: q15-exec
  labels:
    app.kubernetes.io/name: q15-exec
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: q15-exec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: q15-exec
    spec:
      initContainers:
        - name: bootstrap-nix
          image: ghcr.io/q15co/q15-exec:main
          command:
            - /nix/var/nix/profiles/default/bin/bash
            - -lc
            - |
              set -euo pipefail
              target=/var/lib/q15/bootstrap-nix
              image_floor_version="$(< /etc/q15/exec-floor.version)"
              runtime_floor_version=
              if [[ -f "$target/.q15-exec-floor.version" ]]; then
                runtime_floor_version="$(< "$target/.q15-exec-floor.version")"
              fi
              if [[ -x "$target/var/nix/profiles/default/bin/nix" ]] && [[ -x "$target/var/nix/profiles/default/bin/bash" ]] && [[ -d "$target/store" ]] && { [[ -L "$target/var/nix/profiles/q15-floor" ]] || [[ -e "$target/var/nix/profiles/q15-floor" ]]; } && [[ "$runtime_floor_version" == "$image_floor_version" ]]; then
                echo "q15-exec: existing /nix volume already has a usable bootstrap runtime"
                exit 0
              fi
              echo "q15-exec: bootstrapping /nix volume from image contents"
              mkdir -p "$target"
              cp -a /nix/. "$target"/
              printf '%s\n' "$image_floor_version" > "$target/.q15-exec-floor.version"
              if [[ ! -x "$target/var/nix/profiles/default/bin/nix" ]] || [[ ! -x "$target/var/nix/profiles/default/bin/bash" ]] || [[ ! -d "$target/store" ]]; then
                echo "q15-exec: bootstrapped /nix volume is still missing required runtime markers" >&2
                exit 1
              fi
              if [[ ! -L "$target/var/nix/profiles/q15-floor" ]] && [[ ! -e "$target/var/nix/profiles/q15-floor" ]]; then
                echo "q15-exec: bootstrapped /nix volume is missing the q15-floor profile" >&2
                exit 1
              fi
              while IFS= read -r binary; do
                if [[ ! -x "$target/var/nix/profiles/q15-floor/bin/$binary" ]]; then
                  echo "q15-exec: bootstrapped /nix volume is missing exec floor binary \"$binary\"" >&2
                  exit 1
                fi
              done < /etc/q15/exec-floor.manifest
          volumeMounts:
            - name: nix
              mountPath: /var/lib/q15/bootstrap-nix
      containers:
        - name: exec
          image: ghcr.io/q15co/q15-exec:main
          env:
            # Neutral default; an overlay patches this to the deployment's timezone.
            - name: TZ
              value: "UTC"
          ports:
            - name: grpc
              containerPort: 50051
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: memory
              mountPath: /memory
              readOnly: true
            - name: media
              mountPath: /media
            - name: skills
              mountPath: /skills
            - name: nix
              mountPath: /nix
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: q15-workspace
        - name: memory
          persistentVolumeClaim:
            claimName: q15-memory
        - name: media
          persistentVolumeClaim:
            claimName: q15-media
        - name: skills
          persistentVolumeClaim:
            claimName: q15-skills
        - name: nix
          persistentVolumeClaim:
            claimName: q15-exec-nix
